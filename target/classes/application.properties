spring.application.name=tourist-records-api
server.port=8080

# Demo database: runs locally without installing MySQL
spring.datasource.url=jdbc:h2:mem:touristdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Demo token. Change this value before using outside local development.
app.security.api-token=${TOURIST_API_TOKEN:tourist-demo-token-123}

# MySQL alternative (comment the H2 settings above and uncomment/configure these):
# spring.datasource.url=jdbc:mysql://localhost:3306/touristdb
# spring.datasource.username=root
# spring.datasource.password=YOUR_DB_PASSWORD
